name: Webperf trend report

on:
  schedule:
    # Mondays at 06:20 UTC. A stable weekly cadence makes changes comparable.
    - cron: "20 6 * * 1"
  workflow_dispatch:
    inputs:
      url:
        description: URL to measure
        required: true
        default: https://helsingborg.se/
        type: string
      tests:
        description: Comma-separated Webperf Core test IDs
        required: true
        default: "1,2,4,5,9,10,15,18,21,22,23,24,25,26,27,28,30,31,32"
        type: string

permissions:
  contents: read

env:
  TEST_TAG: helsingborg-webperf-trends:${{ github.run_id }}
  TRENDS_REPOSITORY: helsingborg-stad/webperf_trends
  DEFAULT_URL: https://helsingborg.se/
  # Matches the test suite currently presented for Helsingborg on webperf.se.
  DEFAULT_TESTS: "1,2,4,5,9,10,15,18,21,22,23,24,25,26,27,28,30,31,32"

jobs:
  measure-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out Webperf Core
        uses: actions/checkout@v7

      - name: Build the pinned Webperf Core image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.TEST_TAG }}

      - name: Check out the trend repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TRENDS_REPOSITORY }}
          ref: main
          token: ${{ secrets.WEBPERF_TRENDS_TOKEN }}
          path: trends

      - name: Run and publish one comparable Webperf suite
        env:
          MEASURED_URL: ${{ inputs.url || env.DEFAULT_URL }}
          MEASURED_TESTS: ${{ inputs.tests || env.DEFAULT_TESTS }}
          CORE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          report_time="$(date -u +%Y-%m-%dT%H%M%SZ)"
          result_dir="$RUNNER_TEMP/webperf-results"
          mkdir -p "$result_dir"
          result_file="$result_dir/$report_time.json"
          metadata_file="$result_dir/$report_time.meta.json"
          container_name="webperf-trend-${RUN_ID}"

          # Run the complete profile in one Core process. Core then creates its
          # own type_of_test=-1 aggregate, using the same calculation path as a
          # normal multi-test Webperf run.
          docker create --name "$container_name" "$TEST_TAG" python default.py \
            -t "$MEASURED_TESTS" -u "$MEASURED_URL" -o /tmp/webperf-result.json \
            --setting general.language=sv \
            --setting general.review.improve-only=false \
            --setting tests.sitespeed.iterations=3
          docker start -a "$container_name"
          docker cp "$container_name:/tmp/webperf-result.json" "$result_file"
          docker rm -f "$container_name"

          python3 - <<'PY' > "$metadata_file"
          import json
          import os
          print(json.dumps({
              "url": os.environ["MEASURED_URL"],
              "tests": os.environ["MEASURED_TESTS"].split(","),
              "completed_tests": os.environ["MEASURED_TESTS"].split(","),
              "failed_tests": [],
              "active_test": "",
              "core_sha": os.environ["CORE_SHA"],
              "workflow_run": os.environ["RUN_ID"],
              "profile": "webperf-se-parity-v1 / one Core suite / Sitespeed: 3 iterations"
          }, ensure_ascii=False, indent=2))
          PY

          # Rebuild on the newest dashboard version. A retry protects the
          # completed report if somebody updates the site while this job runs.
          for attempt in 1 2 3 4 5; do
            if (
              cd trends
              git fetch origin main
              git reset --hard origin/main
              cp "$result_file" "data/runs/$report_time.json"
              cp "$metadata_file" "data/runs/$report_time.meta.json"
              python3 scripts/build.py
              git config user.name "webperf-trends[bot]"
              git config user.email "webperf-trends[bot]@users.noreply.github.com"
              # --all includes a newly-created detail page; plain `git add`
              # can otherwise leave that untracked report out of the commit.
              git add --all data/runs data/summary.json reports
              if ! git diff --cached --quiet; then
                git commit -m "data: Webperf result $report_time"
              fi
              git push origin HEAD:main
            ); then
              exit 0
            fi
            echo "Trend publishing collided with another update (attempt $attempt/5); retrying..." >&2
            sleep 2
          done
          echo "Could not publish the completed Webperf result after five attempts." >&2
          exit 1

      - name: Keep the raw result with this workflow run
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: webperf-result-${{ github.run_id }}
          path: ${{ runner.temp }}/webperf-results
          if-no-files-found: error
          retention-days: 90
